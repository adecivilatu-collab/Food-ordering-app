<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foodiebator — Home</title>
<link rel="stylesheet" href="../../packages/ui-tokens/tokens.css">
<style>
body{font-family:var(--font-family);color:var(--color-text);background:var(--color-bg);margin:0}
header{background:var(--color-primary-dark);color:#fff;padding:16px;position:sticky;top:0}
header input{width:100%;max-width:480px;border:0;border-radius:var(--radius-md);padding:12px;min-height:var(--touch-min);font-size:var(--fs-16)}
.wrap{max-width:960px;margin:auto;padding:16px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.cat{background:var(--color-surface);border:1px solid var(--color-accent);border-radius:999px;padding:8px 14px;white-space:nowrap;font-size:var(--fs-14);cursor:pointer}
.cat.active{background:var(--color-primary);color:#fff;border-color:var(--color-primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--color-accent);border-radius:var(--radius-lg);overflow:hidden}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--color-surface)}
.card .b{padding:12px}.price{font-size:var(--fs-16);font-weight:700}
.muted{color:var(--color-muted);font-size:var(--fs-14)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:var(--fs-12);font-weight:700}
.open{background:var(--color-success);color:#fff}.closed{background:var(--color-muted);color:#fff}.promo{background:var(--color-accent)}
button{background:var(--color-primary);color:#fff;border:0;border-radius:var(--radius-md);padding:12px;min-height:var(--touch-min);font-size:var(--fs-16);font-weight:700;width:100%}
</style>
</head>
<body>
<header><b>🍲 Foodiebator — Lagos</b><br><input id="q" placeholder="Search jollof, pizza, shawarma..."></header>
<div class="wrap">
<div class="cats" id="cats"></div>
<h2>Nearby Restaurants</h2>
<div class="grid" id="list"><p class="muted">Loading... (start API: npm run dev --workspace api)</p></div>
</div>
<script>
const API = "http://localhost:4000";
let ALL = [], ACTIVE_CAT = "";
function card(x) {
  return `
      <div class="card"><img alt="${x.name}">
        <div class="b"><b>${x.name}</b><div class="muted">${x.cuisines.join(" • ")} • ${x.eta_min} min • ₦${(x.fee_kobo / 100).toLocaleString()} fee</div>
        <span class="badge ${x.open ? "open" : "closed"}">${x.open ? "Open" : "Closed"}</span>
        ${x.promo ? `<span class="badge promo">${x.promo}</span>` : ""} ⭐ ${x.rating} (${x.reviews})
        <p><a href="restaurant.html?id=${x.id}"><button>View Menu</button></a></p></div></div>`;
}
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const list = ALL.filter((x) => {
    if (ACTIVE_CAT && !x.cuisines.includes(ACTIVE_CAT)) return false;
    if (q && !(x.name.toLowerCase().includes(q) || x.cuisines.join(" ").toLowerCase().includes(q))) return false;
    return true;
  });
  document.querySelectorAll(".cat").forEach((el) => el.classList.toggle("active", el.dataset.c === ACTIVE_CAT));
  document.getElementById("list").innerHTML = list.map(card).join("") || "<p>No matches — try another word or category.</p>";
}
function pick(c) {
  ACTIVE_CAT = ACTIVE_CAT === c ? "" : c;
  render();
}
async function load() {
  let demo = false;
  try {
    const cats = await (await fetch(API + "/categories")).json();
    document.getElementById("cats").innerHTML = cats.categories.map((c) => `<button class="cat" data-c="${c}" onclick="pick('${c}')">${c}</button>`).join("");
    const r = await (await fetch(API + "/restaurants")).json();
    ALL = r.restaurants;
  } catch (e) {
    demo = true;
    document.getElementById("cats").innerHTML = ["Nigerian", "Burgers", "Shawarma", "Chicken", "Rice", "Fast Food"].map((c) => `<button class="cat" data-c="${c}" onclick="pick('${c}')">${c}</button>`).join("");
    ALL = [
      { id: "r1", name: "Mama Put Kitchen", cuisines: ["Nigerian", "Rice"], rating: 4.2, reviews: 180, eta_min: 25, fee_kobo: 80000, open: true, promo: "Free Delivery" },
      { id: "r2", name: "Chicken Republic Lite", cuisines: ["Fast Food", "Chicken"], rating: 4.5, reviews: 320, eta_min: 20, fee_kobo: 50000, open: true },
      { id: "r4", name: "Golfer's Hub", cuisines: ["Burgers", "Shawarma", "Fast Food"], rating: 4.6, reviews: 210, eta_min: 22, fee_kobo: 60000, open: true, promo: "New" },
    ];
  }
  render();
  if (demo) document.getElementById("list").insertAdjacentHTML("beforebegin", "<p class='muted'>Demo preview — connect to live API for ordering.</p>");
}
document.getElementById("q").addEventListener("input", render);
load();
</script>
</body>
</html>
