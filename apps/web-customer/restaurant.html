<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaurant Menu</title>
<link rel="stylesheet" href="assets/tokens.css">
<style>
body{font-family:var(--font-family);color:var(--color-text);background:var(--color-bg);margin:0}
header{background:var(--color-primary-dark);color:#fff;padding:16px}
.wrap{max-width:960px;margin:auto;padding:16px}
.item{background:#fff;border:1px solid var(--color-accent);border-radius:var(--radius-lg);padding:12px;margin:10px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}
.price{font-size:var(--fs-16);font-weight:700}.muted{color:var(--color-muted);font-size:var(--fs-14)}
button{background:var(--color-primary);color:#fff;border:0;border-radius:var(--radius-md);padding:12px 18px;min-height:var(--touch-min);font-size:var(--fs-16);font-weight:700}
select,input{border:1px solid var(--color-accent);border-radius:var(--radius-md);padding:10px;font-size:var(--fs-16)}
#bar{position:sticky;bottom:0;background:var(--color-primary-dark);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
#bar a{color:var(--color-accent);font-weight:700}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;max-height:75vh;overflow:auto;padding:16px 16px 24px;transform:translateY(100%);transition:transform .3s;box-shadow:0 -4px 24px rgba(0,0,0,.25);z-index:10}
#sheet.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9}
#scrim.open{display:block}
.grab{width:48px;height:5px;border-radius:99px;background:var(--color-accent);margin:0 auto 12px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;max-height:75vh;overflow:auto;padding:16px 16px 24px;transform:translateY(100%);transition:transform .3s;box-shadow:0 -4px 24px rgba(0,0,0,.25);z-index:10}
#sheet.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;z-index:9}
#scrim.open{display:block}
.grab{width:48px;height:5px;border-radius:99px;background:var(--color-accent);margin:0 auto 12px}
</style>
</head>
<body>
<header><a href="index.html" style="color:var(--color-accent)">< Home</a> <img src="assets/logo.svg" alt="Foodiebator" style="height:32px;vertical-align:middle;border-radius:8px"><h2 id="name" style="margin:4px 0">Restaurant</h2><div class="muted" id="info" style="color:#eee"></div></header>
<div class="wrap"><div id="menu"><p class="muted">Loading menu...</p></div>
<h3>Reviews</h3><div id="reviews"><p class="muted">Loading reviews...</p></div></div>
<div id="bar"><span id="count">Cart: 0 items</span><span><a href="cart.html">Full cart ></a> <button onclick="sheet(true)" style="width:auto;margin-left:8px">View Cart</button></span></div>
<div id="scrim" onclick="sheet(false)"></div>
<div id="switchprompt" style="display:none;position:fixed;left:12px;right:12px;bottom:140px;background:#fff;border:2px solid var(--color-accent);border-radius:16px;padding:16px;z-index:30;box-shadow:0 8px 28px rgba(0,0,0,.3)">
<b>Start a new cart here?</b><p class="muted" id="switchtext" style="margin:6px 0"></p>
<button onclick="doSwitch()" style="width:auto">Switch (items saved)</button>
<button onclick="hideSwitch()" style="width:auto;background:var(--color-muted)">Keep old cart</button>
</div>
<div id="sheet"><div class="grab"></div><h3 style="margin-top:0">Your cart</h3><div id="lines"></div><button onclick="location='cart.html'">Checkout ></button> <button onclick="sheet(false)" style="background:var(--color-muted)">Close</button></div>
<script>
const API = localStorage.getItem("apiBase") || "http://localhost:4000";
const id = new URLSearchParams(location.search).get("id") || "r1";
let SESSION = localStorage.getItem("session");
if (!SESSION) { fetch(API + "/guest/session").then((r) => r.json()).then((j) => { SESSION = j.session; localStorage.setItem("session", SESSION); }); }
async function load() {
  const r = await (await fetch(API + "/r/" + id)).json();
  document.getElementById("name").textContent = r.name;
  document.getElementById("info").textContent = `${r.area || "Lagos"} | ${r.cuisines.join(" | ")} | * ${r.rating} (${r.reviews}) | ${r.eta_min} min`;
  const m = await (await fetch(API + "/r/" + id + "/menu")).json();
  document.getElementById("menu").innerHTML = m.menu.map((f) => `
    <div class="item"><div><b>${f.name}</b><div class="price">[N]${(f.price_kobo / 100).toLocaleString()}</div>
    ${f.options ? f.options.map((o) => `<select data-f="${f.id}" data-t="${o.type}">${o.choices.map((c) => `<option>${c.name}${c.delta_kobo ? " (+[N]" + (c.delta_kobo / 100).toLocaleString() + ")" : ""}</option>`).join("")}</select>`).join("") : ""}</div>
    <button onclick="add('${f.id}')">Add +</button></div>`).join("");
  try {
    const rv = await (await fetch(API + "/r/" + id + "/reviews")).json();
    document.getElementById("reviews").innerHTML = (rv.reviews || []).filter((x) => x.moderation === "approved").map((x) => `<p><b>*${x.restaurant_rating} Food ${x.food_rating} Rider ${x.delivery_rating}</b> - ${x.text || ""}</p>`).join("") || "<p class='muted'>No reviews yet - be the first after delivery.</p>";
  } catch { document.getElementById("reviews").innerHTML = ""; }
  refresh();
}
let PENDING_ADD = null;
async function add(item_id) {
  const options = {};
  document.querySelectorAll(`select[data-f="${item_id}"]`).forEach((s) => (options[s.dataset.t] = s.value.split(" (+")[0]));
  const r = await (await fetch(API + "/cart", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session: SESSION, item_id, qty: 1, options }) })).json();
  if (r.error && r.cart) {
    PENDING_ADD = { item_id, options };
    const n = r.cart.lines.reduce((s, l) => s + l.qty, 0);
    document.getElementById("switchtext").textContent = `Your cart has ${n} item(s) from another restaurant - kept safe. Switch to order here?`;
    document.getElementById("switchprompt").style.display = "block";
    return;
  }
  refresh();
}
async function doSwitch() {
  await fetch(API + "/cart/switch", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session: SESSION }) });
  document.getElementById("switchprompt").style.display = "none";
  if (PENDING_ADD) { const p = PENDING_ADD; PENDING_ADD = null; add(p.item_id); }
  else refresh();
}
function hideSwitch() { document.getElementById("switchprompt").style.display = "none"; PENDING_ADD = null; }
async function refresh() {
  if (!SESSION) return;
  const c = await (await fetch(API + "/cart?session=" + SESSION)).json();
  const n = c.lines.reduce((s, l) => s + l.qty, 0);
  document.getElementById("count").textContent = `Cart: ${n} items | [N]${((c.subtotal_kobo || 0) / 100).toLocaleString()}`;
  document.getElementById("lines").innerHTML = c.lines.map((l) => `<p><b>${l.name} x ${l.qty}</b> - [N]${(l.line_kobo / 100).toLocaleString()}</p>`).join("") || "<p>Empty.</p>";
}
function sheet(open) {
  document.getElementById("sheet").classList.toggle("open", open);
  document.getElementById("scrim").classList.toggle("open", open);
  if (open) refresh();
}
load();
</script>
<style>
#chatbtn{position:fixed;bottom:76px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--color-primary);color:#fff;border:0;font-size:24px;z-index:20;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
#chatbox{position:fixed;bottom:140px;right:16px;width:min(340px,90vw);max-height:50vh;background:#fff;border:1px solid var(--color-accent);border-radius:16px;display:none;flex-direction:column;overflow:hidden;z-index:20;box-shadow:0 8px 28px rgba(0,0,0,.3)}
#chatbox.open{display:flex}
#chatlog{padding:12px;overflow:auto;flex:1;font-size:14px}
#chatlog .u{text-align:right;margin:6px 0}#chatlog .u span{background:var(--color-primary);color:#fff;border-radius:12px;padding:6px 10px;display:inline-block}
#chatlog .b{margin:6px 0}#chatlog .b span{background:var(--color-surface);border-radius:12px;padding:6px 10px;display:inline-block}
#chatrow{display:flex;border-top:1px solid var(--color-accent)}#chatrow input{flex:1;border:0;padding:12px;font-size:14px}#chatrow button{width:auto;border-radius:0}
</style>
<button id="chatbtn" onclick="chatToggle()">?</button>
<div id="chatbox"><div id="chatlog"><div class="b"><span>Hi! Ask about orders, fees, or food.</span></div></div><div id="chatrow"><input id="chatq" placeholder="Type a question..."><button onclick="chatSend()">Send</button></div></div>
<script>
async function chatSend() {
  const q = document.getElementById("chatq");
  const text = q.value.trim();
  if (!text) return;
  q.value = "";
  const log = document.getElementById("chatlog");
  log.innerHTML += `<div class="u"><span>${text.replace(/</g, "&lt;")}</span></div>`;
  log.innerHTML += `<div class="b" id="typing"><span>...</span></div>`;
  try {
    const r = await (await fetch(((typeof API !== "undefined" ? API : localStorage.getItem("apiBase")) || "http://localhost:4000") + "/support/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: text }) })).json();
    document.getElementById("typing").outerHTML = `<div class="b"><span>${r.answer.replace(/</g, "&lt;")}</span></div>`;
  } catch { document.getElementById("typing").outerHTML = `<div class="b"><span>API offline - start it first.</span></div>`; }
  log.scrollTop = log.scrollHeight;
}
function chatToggle() { document.getElementById("chatbox").classList.toggle("open"); }
document.addEventListener("keydown", (e) => { if (e.key === "Enter" && document.activeElement && document.activeElement.id === "chatq") chatSend(); });
</script>
<style>
#bellbtn{position:fixed;bottom:140px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--color-primary-dark);color:#fff;border:0;font-size:24px;z-index:20;cursor:pointer}
#bellbadge{position:fixed;bottom:182px;right:16px;background:var(--color-danger);color:#fff;border-radius:999px;min-width:22px;height:22px;font-size:12px;font-weight:800;display:none;z-index:21;text-align:center;line-height:22px}
#toasts{position:fixed;top:12px;left:12px;right:12px;z-index:40}
.toast{background:var(--color-primary-dark);color:#fff;border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
</style>
<button id="bellbtn" onclick="location='track.html' + (localStorage.getItem('lastOrderId') ? '?id=' + localStorage.getItem('lastOrderId') : '')">!</button>
<div id="bellbadge"></div>
<div id="toasts"></div>
<script>
let LAST_STATUS = localStorage.getItem("lastOrderStatus") || "";
let UNREAD = 0;
async function pollOrder() {
  const id = localStorage.getItem("lastOrderId");
  if (!id) return;
  try {
    const t = await (await fetch(((typeof API !== "undefined" ? API : localStorage.getItem("apiBase")) || "http://localhost:4000") + "/track/" + id)).json();
    if (t.status && t.status !== LAST_STATUS) {
      if (LAST_STATUS) {
        UNREAD++;
        const b = document.getElementById("bellbadge");
        b.style.display = "block"; b.textContent = UNREAD;
        const d = document.createElement("div");
        d.className = "toast";
        d.textContent = t.order_no + ": " + t.status.replace(/_/g, " ");
        document.getElementById("toasts").appendChild(d);
        setTimeout(() => d.remove(), 6000);
      }
      LAST_STATUS = t.status;
      localStorage.setItem("lastOrderStatus", t.status);
    }
  } catch {}
}
document.getElementById("bellbtn").addEventListener("click", () => { UNREAD = 0; document.getElementById("bellbadge").style.display = "none"; });
setInterval(pollOrder, 15000);
pollOrder();
</script>
</body>
</html>
