# Free local stack: Postgres+PostGIS, Redis, MinIO (S3-compatible). No paid services.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: food
      POSTGRES_PASSWORD: food
      POSTGRES_DB: fooddb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  s3:
    image: localstack/localstack:latest
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - minio-data:/var/lib/localstack
  api:
    build: ./api
    ports:
      - "4000:4000"
    env_file: .env
    depends_on:
      - db
      - redis
  web:
    build: ./apps/web-customer
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
